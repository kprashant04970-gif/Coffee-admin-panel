# ==============================================================================
# Manhattan Coffee Admin Panel — Nginx Reverse Proxy Configuration
# File: /etc/nginx/sites-available/manhattan.conf
# Hostinger VPS Ubuntu 22.04 / 24.04 LTS
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=manhattan_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=manhattan_api:10m rate=60r/m;

# Upstream Next.js Node.js Server
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name admin.manhattancoffee.in;

    # Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Secure Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.manhattancoffee.in;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/admin.manhattancoffee.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.manhattancoffee.in/privkey.pem;

    # SSL Hardening & Modern Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Performance & Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    client_max_body_size 60M; # Accommodate CCTV video upload chunks

    # Static Assets Cache (Next.js static bundles)
    location /_next/static/ {
        alias /var/www/manhattan/app/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Direct VPS Storage Serving for Uploads & CCTV Clips
    location /uploads/ {
        alias /var/www/manhattan/uploads/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # Rate Limiting on Authentication Endpoints
    location /api/auth/ {
        limit_req zone=manhattan_auth burst=5 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events (SSE) & Polling Telemetry Endpoints
    location /api/live/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Application Proxy
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
